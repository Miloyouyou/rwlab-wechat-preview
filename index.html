<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>机器人焊接智能化技术实验室 · 公众号推文预览</title>
  <style>
    :root{color-scheme:light;--red:#a71933;--ink:#183247;--muted:#627384;--line:#e4e9ed}
    *{box-sizing:border-box}body{margin:0;background:#f2f4f6;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
    .wrap{max-width:980px;margin:auto;padding:clamp(24px,5vw,60px) 20px 72px}
    .eyebrow{color:var(--red);font-size:13px;font-weight:700;letter-spacing:.12em}
    h1{margin:12px 0 14px;font-size:clamp(26px,4vw,40px);line-height:1.3}
    .intro{margin:0 0 32px;color:var(--muted);line-height:1.75}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .card{display:block;overflow:hidden;border:1px solid var(--line);background:#fff;color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s}
    .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 12px 32px #18324718;outline-color:var(--red)}
    .card img{display:block;width:100%;height:220px;object-fit:cover}
    .card-body{padding:22px}.tag{color:var(--red);font-size:12px;font-weight:700;letter-spacing:.08em}
    h2{margin:9px 0;font-size:22px;line-height:1.4}.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
    .open{display:inline-block;margin-top:16px;color:var(--red);font-weight:700}
    footer{margin-top:32px;color:var(--muted);font-size:13px;line-height:1.7}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.card img{height:185px}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">SHANGHAI JIAO TONG UNIVERSITY</p>
    <h1>公众号推文预览</h1>
    <p class="intro">上海交通大学机器人焊接智能化技术实验室 · 两篇推文的网页预览。点击卡片查看正文；本页面不是微信公众号发布页。</p>
    <div class="grid">
      <a class="card" href="01_实验室团队/公众号正文.html">
        <img src="01_实验室团队/配图/团队封面.png" alt="机器人焊接智能化团队宣传封面">
        <div class="card-body"><span class="tag">团队建设</span><h2>走进机器人焊接智能化团队</h2><p class="desc">了解实验室的研究方向、代表性成果与科研团队。</p><span class="open">查看推文 →</span></div>
      </a>
      <a class="card" href="02_RWIA会议通知/公众号正文.html">
        <img src="02_RWIA会议通知/配图/meeting-cover.png" alt="RWIA 2026 会议推文封面">
        <div class="card-body"><span class="tag">学术交流</span><h2>RWIA 2026 · CCRW 2026 会议通知</h2><p class="desc">查看会议介绍、征稿信息与图文版式。</p><span class="open">查看推文 →</span></div>
      </a>
    </div>
    <footer>预览内容以正式发布前的最终审核稿为准。</footer>
  </main>
</body>
</html>
